name: Computer-use wire checks

on:
  push:
    paths:
      - 'tavi_control_*.py'
      - 'tavi_predict_stream.py'
      - 'tavi.py'
      - 'tavi_model.py'
      - 'tavi_quantize.py'
      - 'release-files.json'
      - 'test_model_warm_adapters.py'
      - 'test_control_*.py'
      - 'test_predict_stream.py'
      - 'benchmarks/control_matrix_benchmark.py'
      - 'benchmarks/warm_prediction_benchmark.py'
      - '.github/workflows/computer-use-wire.yml'
  pull_request:
    paths:
      - 'tavi_control_*.py'
      - 'tavi_predict_stream.py'
      - 'tavi.py'
      - 'tavi_model.py'
      - 'tavi_quantize.py'
      - 'release-files.json'
      - 'test_model_warm_adapters.py'
      - 'test_control_*.py'
      - 'test_predict_stream.py'
      - 'benchmarks/control_matrix_benchmark.py'
      - 'benchmarks/warm_prediction_benchmark.py'
      - '.github/workflows/computer-use-wire.yml'

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model runtime
        run: python -m pip install -r requirements.txt
      - name: Run control-protocol regressions
        run: python -m unittest -q test_control_matrix test_control_compact test_control_stream test_control_index
      - name: Run warm prediction and model compatibility tests
        run: python -m unittest -q test_predict_stream test_model_warm_adapters test_probability_quantization test_features test_coding_confidence
      - name: Check control benchmark and round trip
        run: python benchmarks/control_matrix_benchmark.py
      - name: Measure warm prediction against cold CLI
        run: python benchmarks/warm_prediction_benchmark.py
      - name: Validate portable release includes new features
        run: python bundle_tavi.py
